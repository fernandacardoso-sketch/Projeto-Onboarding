<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="application-name" content="Onboarding Assignment">
<meta name="description" content="Aceite da sugestão de onboarder do N6+ pela coordenação.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FF4000">
<script>
  // tema antes da renderização: escolha salva > preferência do sistema
  (function () {
    var t = 'light';
    try {
      var s = localStorage.getItem('carteira_tema');
      if (s === 'light' || s === 'dark') t = s;
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
    } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<title>Aceitar sugestão · Onboarding Assignment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange:#FF4000; --black:#0D0D0D;
    --bg:#F5F3EF; --card:#FFFFFF; --card-border:#D9D5CD; --sunken:#EFECE6; --border:#E2DED7; --border-strong:#D3CEC5;
    --text:#0D0D0D; --muted:rgba(13,13,13,.62); --field-border:#9A958C; --focus:#0D0D0D;
    --ok-bg:rgba(30,122,61,.12); --ok-text:#17632F; --err-bg:rgba(217,48,37,.12); --err-text:#B3261E; --warn-bg:#FFD450; --destaque:#C23100;
    --r-sm:6px; --r-md:10px; --r-pill:999px; --sh:0 1px 2px rgba(13,13,13,.08);
  }
  :root[data-theme="dark"]{
    --bg:#141414; --card:#242424; --card-border:#4D4D4D; --sunken:#2D2D2D; --border:#3A3A3A; --border-strong:#4D4D4D;
    --text:#F5F3EF; --muted:rgba(245,243,239,.68); --field-border:#8A8A8A; --focus:#F5F3EF;
    --ok-bg:rgba(111,208,140,.16); --ok-text:#6FD08C; --err-bg:rgba(255,143,133,.16); --err-text:#FF9A91; --destaque:#FF8A5C;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"DM Sans","Arial",sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  button, input{ font-family:inherit; }
  .topo{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px; }
  .marca{ font-size:14px; font-weight:700; letter-spacing:.01em; }
  .marca span{ color:var(--orange); }
  .tema{ width:38px; height:38px; display:grid; place-items:center; border:1.5px solid var(--field-border); border-radius:var(--r-sm); background:var(--card); color:var(--text); cursor:pointer; }
  .tema:focus-visible, .btn:focus-visible, input:focus-visible, a:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  .tema svg{ width:18px; height:18px; }
  :root[data-theme="dark"] .i-moon, :root:not([data-theme="dark"]) .i-sun{ display:none; }
  main{ width:100%; max-width:560px; margin:0 auto; padding:8px 16px 48px; }
  .card{ background:var(--card); border:1px solid var(--card-border); border-radius:var(--r-md); box-shadow:var(--sh); padding:24px; }
  h1{ margin:0 0 4px; font-size:22px; line-height:1.2; letter-spacing:-.01em; }
  .sub{ margin:0 0 20px; font-size:14px; color:var(--muted); }
  label{ display:block; margin:0 0 14px; font-size:13px; font-weight:600; }
  input{ width:100%; margin-top:6px; padding:11px 12px; font-size:15px; color:var(--text); background:var(--card); border:1.5px solid var(--field-border); border-radius:var(--r-sm); }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:10px 20px; font-size:15px; font-weight:700; border:0; border-radius:var(--r-pill); cursor:pointer; text-decoration:none; }
  .btn.primario{ background:var(--orange); color:var(--black); }
  .btn.primario:hover:not([disabled]){ filter:brightness(.95); }
  .btn.sec{ background:transparent; color:var(--text); border:1.5px solid var(--field-border); }
  .btn[disabled]{ opacity:.55; cursor:not-allowed; }
  .acoes{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; }
  .msg{ margin:0 0 16px; padding:10px 14px; border-radius:var(--r-sm); font-size:14px; font-weight:600; }
  .msg.erro{ background:var(--err-bg); color:var(--err-text); }
  .msg.ok{ background:var(--ok-bg); color:var(--ok-text); }
  .msg.aviso{ background:var(--sunken); color:var(--text); }
  dl{ margin:0; display:grid; grid-template-columns:140px 1fr; gap:10px 14px; font-size:14px; }
  dt{ color:var(--muted); font-weight:500; }
  dd{ margin:0; font-weight:600; overflow-wrap:anywhere; }
  .sugestao{ margin:18px 0 0; padding:14px 16px; border-radius:var(--r-md); background:var(--sunken); border-left:4px solid var(--orange); }
  .sugestao small{ display:block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); }
  .sugestao b{ display:block; margin-top:2px; font-size:17px; color:var(--destaque); overflow-wrap:anywhere; }
  .sugestao span{ display:block; margin-top:2px; font-size:13px; color:var(--muted); }
  .estado{ display:inline-block; padding:3px 10px; font-size:12px; font-weight:700; border-radius:var(--r-pill); background:var(--warn-bg); color:var(--black); }
  .estado.aceita{ background:var(--ok-bg); color:var(--ok-text); }
  .rodape{ margin:16px 0 0; font-size:12px; color:var(--muted); text-align:center; }
  .carregando{ display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px; }
  .giro{ width:16px; height:16px; border:2px solid var(--border-strong); border-top-color:var(--orange); border-radius:50%; animation:g .8s linear infinite; }
  @keyframes g{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .giro{ animation:none; } }
  [hidden]{ display:none !important; }
  @media (max-width:480px){ dl{ grid-template-columns:1fr; gap:2px; } dd{ margin-bottom:8px; } .btn{ width:100%; } }
</style>
</head>
<body>
  <header class="topo">
    <div class="marca">Onboarding <span>Assignment</span></div>
    <button type="button" class="tema" id="temaBtn" aria-label="Mudar para o tema escuro" title="Tema escuro">
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main>
    <div class="card" id="cartao" aria-live="polite">
      <h1>Sugestão de atribuição (N6+)</h1>
      <p class="sub" id="sub">Confirme para definir o onboarder na Oportunidade.</p>
      <div id="aviso" class="msg erro" role="alert" hidden></div>

      <!-- login (mesma senha e mesmo e-mail do Onboarding Assignment) -->
      <form id="loginForm" hidden novalidate>
        <label>E-mail
          <input type="email" id="email" autocomplete="username" placeholder="nome.sobrenome@hotmart.com" required>
        </label>
        <label>Senha
          <input type="password" id="senha" autocomplete="current-password" required>
        </label>
        <div class="acoes"><button type="submit" class="btn primario" id="entrarBtn">Entrar</button></div>
      </form>

      <div id="carregando" class="carregando"><span class="giro" aria-hidden="true"></span> Carregando a sugestão...</div>

      <!-- detalhe da sugestão -->
      <section id="detalhe" hidden>
        <div style="margin-bottom:14px"><span class="estado" id="estado">Pendente</span></div>
        <dl>
          <dt>Oportunidade</dt><dd id="dOpp"></dd>
          <dt>Amount 12m</dt><dd id="dAmount"></dd>
          <dt>Closer</dt><dd id="dCloser"></dd>
          <dt>Segmento</dt><dd id="dSeg"></dd>
        </dl>
        <div class="sugestao">
          <small>Sugestão de onboarder</small>
          <b id="dOnb"></b>
          <span id="dOnbInfo"></span>
        </div>
        <div class="acoes">
          <button type="button" class="btn primario" id="aceitarBtn">Aceitar sugestão</button>
          <a class="btn sec" id="sfLink" href="#" target="_blank" rel="noopener noreferrer">Abrir no Salesforce</a>
        </div>
      </section>
    </div>
    <p class="rodape" id="quem"></p>
  </main>
<script>
(function () {
  'use strict';
  var BASE = 'https://hotmart.app.n8n.cloud/webhook/';
  var SESSION_KEY = 'carteira_sessao';
  var TOKEN = (new URLSearchParams(location.search).get('t') || '').trim();
  var $ = function (id) { return document.getElementById(id); };
  var aviso = $('aviso'), loginForm = $('loginForm'), carregando = $('carregando'), detalhe = $('detalhe'), aceitarBtn = $('aceitarBtn');

  // tema
  var temaBtn = $('temaBtn');
  function tema() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function rotuloTema() { var e = tema() === 'dark'; temaBtn.setAttribute('aria-label', e ? 'Mudar para o tema claro' : 'Mudar para o tema escuro'); temaBtn.title = e ? 'Tema claro' : 'Tema escuro'; }
  temaBtn.addEventListener('click', function () { var n = tema() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('carteira_tema', n); } catch (e) {} rotuloTema(); });
  rotuloTema();

  function sessao() {
    try { var s = JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); if (s && s.token && new Date(s.expira_em) > new Date()) return s; } catch (e) {}
    sessionStorage.removeItem(SESSION_KEY); return null;
  }
  function msg(texto, tipo) { aviso.textContent = texto; aviso.className = 'msg ' + (tipo || 'erro'); aviso.hidden = !texto; aviso.setAttribute('role', tipo === 'ok' ? 'status' : 'alert'); }
  function mostrar(qual) { loginForm.hidden = qual !== 'login'; carregando.hidden = qual !== 'carregando'; detalhe.hidden = qual !== 'detalhe'; }
  var brl = function (n) { return Number(n) > 0 ? 'R$ ' + Number(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : 'não informado'; };
  var nome = function (e) { return String(e || '').split('@')[0].split(/[._-]+/).filter(Boolean).map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ') || '-'; };
  function dataBR(iso) { try { return new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

  async function chamar(corpo) {
    var s = sessao(); if (!s) { mostrar('login'); throw new Error('login'); }
    var res = await fetch(BASE + 'sugestao-n6', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + s.token }, body: JSON.stringify(corpo) });
    var dados = {}; try { dados = await res.json(); } catch (e) {}
    if (res.status === 401) { sessionStorage.removeItem(SESSION_KEY); mostrar('login'); msg('Sua sessão expirou. Entre de novo.', 'aviso'); throw new Error('login'); }
    return { ok: res.ok, status: res.status, dados: dados };
  }

  function preencher(e) {
    $('dOpp').textContent = e.cliente || e.opp_id;
    $('dAmount').textContent = brl(e.amount);
    $('dCloser').textContent = nome(e.closer) + ' (POD ' + (e.pod_closer || '-') + ')';
    $('dSeg').textContent = (e.level || 'N6+') + ' · ' + String(e.subgrupo || '').toUpperCase();
    $('dOnb').textContent = e.onboarder;
    $('dOnbInfo').textContent = 'POD ' + e.pod + ', ' + (e.origem === 'outro_pod' ? 'outro POD do mesmo nível' : 'mesmo POD do Closer') + (e.criterio ? '. Critério: ' + e.criterio + '.' : '');
    var sf = $('sfLink'); if (/^https:\/\/hotmart\.my\.salesforce\.com\//.test(e.link_sf || '')) sf.href = e.link_sf; else sf.hidden = true;
    var aceita = e.status === 'aceita';
    $('estado').textContent = aceita ? 'Aceita' + (e.aceito_nome || e.aceito_por ? ' por ' + (e.aceito_nome || nome(e.aceito_por)) : '') + (e.aceito_em ? ' em ' + dataBR(e.aceito_em) : '') : 'Pendente';
    $('estado').className = 'estado' + (aceita ? ' aceita' : '');
    aceitarBtn.hidden = aceita; aceitarBtn.disabled = false; aceitarBtn.textContent = 'Aceitar sugestão';
    mostrar('detalhe');
  }

  async function carregar() {
    msg('');
    if (!/^[a-f0-9]{48}$/.test(TOKEN)) { mostrar('detalhe'); detalhe.hidden = true; carregando.hidden = true; msg('Link inválido. Use o botão "Aceitar sugestão" da mensagem no Google Chat.'); return; }
    var s = sessao();
    if (!s) { mostrar('login'); $('quem').textContent = ''; $('email').focus(); return; }
    $('quem').textContent = 'Você está como ' + s.email + '.';
    mostrar('carregando');
    try {
      var r = await chamar({ acao: 'detalhe', t: TOKEN });
      if (!r.ok) { mostrar('nada'); detalhe.hidden = true; carregando.hidden = true; msg((r.dados && r.dados.mensagem) || 'Não foi possível abrir a sugestão.'); return; }
      preencher(r.dados.sugestao);
    } catch (e) { if (e.message !== 'login') { mostrar('nada'); carregando.hidden = true; msg('Falha de conexão. Tente de novo.'); } }
  }

  loginForm.addEventListener('submit', async function (ev) {
    ev.preventDefault(); msg('');
    var email = $('email').value.trim().toLowerCase(), senha = $('senha').value;
    if (!/^[^\s@]+@hotmart\.com$/.test(email) || !senha) { msg('Informe seu e-mail @hotmart.com e a senha.'); return; }
    $('entrarBtn').disabled = true;
    try {
      var res = await fetch(BASE + 'carteira-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: email, password: senha }) });
      var d = {}; try { d = await res.json(); } catch (e) {}
      if (!res.ok || !d.sucesso) { msg(d.mensagem || 'Não foi possível entrar.'); return; }
      sessionStorage.setItem(SESSION_KEY, JSON.stringify({ token: d.token, email: d.email, nome: d.nome, papel: d.papel, expira_em: d.expira_em }));
      $('senha').value = '';
      carregar();
    } catch (e) { msg('Falha de conexão. Tente de novo.'); }
    finally { $('entrarBtn').disabled = false; }
  });

  aceitarBtn.addEventListener('click', async function () {
    aceitarBtn.disabled = true; aceitarBtn.textContent = 'Aceitando...'; msg('');
    try {
      var r = await chamar({ acao: 'aceitar', t: TOKEN });
      if (r.ok) {
        preencher(r.dados.sugestao);
        msg('Sugestão aceita. O onboarder foi definido na Oportunidade e o Closer já pode seguir o processo no Onboarding Assignment.', 'ok');
      } else if (r.status === 409 && r.dados.sugestao) {
        preencher(r.dados.sugestao); msg(r.dados.mensagem || 'Esta sugestão já foi aceita.', 'aviso');
      } else { aceitarBtn.disabled = false; aceitarBtn.textContent = 'Aceitar sugestão'; msg((r.dados && r.dados.mensagem) || 'Não foi possível aceitar.'); }
    } catch (e) { if (e.message !== 'login') { aceitarBtn.disabled = false; aceitarBtn.textContent = 'Aceitar sugestão'; msg('Falha de conexão. Nada foi alterado. Tente de novo.'); } }
  });

  carregar();
})();
</script>
</body>
</html>
